services:
  api:
    build: .
    image: healthcare-resource-optimization:latest
    ports:
      - "8000:8000"
    environment:
      # Number of synthetic visits to generate if artifacts are missing.
      PIPELINE_VISITS: "8000"
    volumes:
      # Persist generated artifacts across container restarts.
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
