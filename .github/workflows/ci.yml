name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, format & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Check formatting (black)
        run: black --check src tests main.py conftest.py

      - name: Lint (pylint)
        # Fail only on errors (E) and fatals (F); style warnings don't block CI.
        run: pylint src main.py --errors-only

      - name: Run tests with coverage
        run: pytest -q --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Smoke-test the pipeline
        run: python main.py --visits 2000 --model random_forest

      - name: Smoke-test the API
        run: |
          python -c "from fastapi.testclient import TestClient; from src.api.app import create_app; c=TestClient(create_app()); r=c.get('/health'); assert r.status_code==200, r.status_code; print('API health:', r.json())"

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t healthcare-resource-optimization:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name hro -p 8000:8000 healthcare-resource-optimization:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          docker rm -f hro

  optional-deps:
    name: Optional deps (Prefect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core + Prefect
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt prefect
      - name: Build the Prefect flow
        run: |
          python -c "from src.orchestration.flow import build_prefect_flow; f=build_prefect_flow(); print('Prefect flow:', getattr(f, 'name', f))"
