name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, format & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Check formatting (black)
        run: black --check src tests main.py

      - name: Lint (pylint)
        # Fail only on errors (E) and fatals (F); style warnings don't block CI.
        run: pylint src main.py --errors-only

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the pipeline
        run: python main.py --visits 2000 --model random_forest
